<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Utforsk Brøset</title>
<meta name="description" content="Interaktivt kart over den nye bydelen Brøset i Trondheim.">
<style>
/* Skrift: Sculpin/Bryant (Adobe Fonts på broset.no) er erstattet med Figtree/Nunito i prototypen */
@font-face{font-family:Fig;font-weight:400;src:url(fonts/figtree-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Fig;font-weight:600;src:url(fonts/figtree-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Fig;font-weight:700;src:url(fonts/figtree-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Fig;font-weight:800;src:url(fonts/figtree-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:Nun;font-weight:400;src:url(fonts/nunito-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Nun;font-weight:600;src:url(fonts/nunito-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Nun;font-weight:700;src:url(fonts/nunito-latin-700-normal.woff2) format('woff2')}
@property --sx{syntax:'<length>';inherits:false;initial-value:0px}
@property --sy{syntax:'<length>';inherits:false;initial-value:0px}
@property --sr{syntax:'<length>';inherits:false;initial-value:2000px}
@property --dx{syntax:'<length>';inherits:true;initial-value:0px}
@property --dy{syntax:'<length>';inherits:true;initial-value:-44px}
@property --len{syntax:'<length>';inherits:true;initial-value:26px}
@property --ang{syntax:'<angle>';inherits:true;initial-value:0deg}
:root{
 --teal:#1C4B4C; --teal-d:#133536; --peach:#E6C9B8; --mint:#97DAB8; --paper:#FEFBF9; --sand:#F7F2ED; --ink:#212121; --line:#DDDDDD;
 --head:'Fig',sculpin,system-ui,sans-serif; --body:'Nun',bryant-web,system-ui,sans-serif;
 --ease:cubic-bezier(.22,.68,.12,1); --dur:1000ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- topp (som broset.no) ---------- */
.top{height:96px;display:flex;align-items:center;justify-content:space-between;padding:0 48px}
.top img{height:30px;display:block}
.top nav{display:flex;gap:22px;font-size:14px;color:var(--teal)}
.top nav b{font-weight:700}
.burger{display:none}

/* ---------- kartet ---------- */
.hero{position:relative;margin:0 auto 24px;width:min(calc(100vw - 96px),calc((100svh - 120px) * 3500 / 2227));aspect-ratio:3500/2227;overflow:hidden;background:#2a2a22;isolation:isolate;user-select:none;-webkit-user-select:none}
.hero img{-webkit-user-drag:none}
.stage{touch-action:pan-y}
.hero.zoomed .stage{cursor:grab}.hero.dragging .stage{cursor:grabbing}
.hero.live .stage,.hero.live .m,.hero.live .plbl a,.hero.live .spot,.hero.live .mini i{transition:none!important}
.stage{position:absolute;inset:0;transform-origin:0 0;transition:transform var(--dur) var(--ease);will-change:transform}
.stage img{position:absolute;display:block;max-width:none}
.spot{position:absolute;inset:0;pointer-events:none;opacity:0;
 background:radial-gradient(circle at var(--sx) var(--sy),rgba(10,30,30,0) 0,rgba(10,30,30,0) calc(var(--sr)*.55),rgba(10,30,30,.5) calc(var(--sr)*1.5),rgba(8,24,24,.72) calc(var(--sr)*3.2));
 transition:opacity 700ms ease,--sx var(--dur) var(--ease),--sy var(--dur) var(--ease),--sr var(--dur) var(--ease)}
.hero.zoom .spot{opacity:1}
.shade{position:absolute;left:0;right:0;top:0;height:170px;pointer-events:none;background:linear-gradient(to bottom,rgba(10,30,30,.6),rgba(10,30,30,0))}
.disc{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;bottom:16px;z-index:9;font-size:12px;color:rgba(254,251,249,.9);text-shadow:0 1px 3px rgba(0,0,0,.6);opacity:0;transition:opacity 400ms}
.hero.zoom .disc{opacity:1}

/* prosjektomriss, uten fyll */
svg.felt{position:absolute;overflow:visible}
svg.felt .h{fill:none;stroke:rgba(19,53,54,.55);stroke-width:calc(var(--sw,1px)*5);stroke-linejoin:round}
svg.felt .f{fill:none;stroke:var(--peach);stroke-width:calc(var(--sw,1px)*2);stroke-linejoin:round;pointer-events:all;cursor:pointer;transition:stroke 200ms,stroke-width 200ms}
svg.felt .f.on{stroke:var(--paper);stroke-width:calc(var(--sw,1px)*3)}
.hero.zoom svg.felt .f{pointer-events:none}
svg.felt a{cursor:pointer}
svg.felt a:focus-visible .f{stroke:var(--paper);stroke-width:calc(var(--sw,1px)*4)}
.plbl a:hover{background:var(--teal);color:var(--paper)}.plbl a:hover small{color:var(--mint)}.plbl a:hover::after{background:var(--teal)}
.plbl{position:absolute;left:0;top:0;z-index:7;pointer-events:none}
.plbl a{position:absolute;transform:translate(-50%,-100%);display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 10px;border-radius:999px;background:var(--paper);color:var(--teal);font-family:var(--head);font-weight:700;font-size:13.5px;white-space:nowrap;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.3);opacity:0;margin-top:-10px;transition:opacity 220ms ease,margin-top 220ms var(--ease)}
.plbl a i{width:10px;height:10px;border:2px solid var(--peach);border-radius:3px;box-shadow:inset 0 0 0 1px rgba(28,75,76,.25)}
.plbl a small{font-family:var(--body);font-weight:700;font-size:11px;color:#3f7a62;letter-spacing:.03em}
.plbl a.kommer small{color:#a8673f}
.plbl a::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;margin-left:-5px;background:var(--paper);transform:rotate(45deg);border-radius:2px}
.plbl a.on{opacity:1;margin-top:-16px;pointer-events:auto}
.plbl a.l{transform:translate(-100%,-50%);margin-top:0;margin-left:-6px}.plbl a.l.on{margin-top:0;margin-left:-14px}
.plbl a.l::after{left:auto;right:-5px;bottom:50%;margin:0 0 -5px 0}
.plbl a.b{transform:translate(-50%,0);margin-top:10px}.plbl a.b.on{margin-top:16px}
.plbl a.b::after{bottom:auto;top:-5px}
.hero.zoom .plbl a{opacity:0!important;pointer-events:none!important}

/* markører */
.pins{position:absolute;inset:0;z-index:6;pointer-events:none}
.m{position:absolute;left:0;top:0;width:0;height:0;pointer-events:auto;--dx:0px;--dy:-44px;--len:26px;--ang:0deg;transition:transform var(--dur) var(--ease),opacity 400ms ease,--dx 700ms var(--ease),--dy 700ms var(--ease),--len 700ms var(--ease),--ang 700ms var(--ease);will-change:transform}
.m .foot{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 2px rgba(28,75,76,.85),0 1px 4px rgba(0,0,0,.4)}
.m .stem{position:absolute;left:-.75px;bottom:0;width:1.5px;height:var(--len);transform-origin:50% 100%;transform:rotate(var(--ang));background:linear-gradient(var(--paper),rgba(254,251,249,.7))}
.m .head{position:absolute;left:calc(var(--dx) - 18px);top:calc(var(--dy) - 18px);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:var(--paper);box-shadow:0 0 0 2px var(--paper),0 6px 16px rgba(0,0,0,.35);transition:transform 300ms var(--ease),background 300ms,color 300ms,box-shadow 300ms}
.m .head svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.m.k-arv .head{background:var(--peach);color:var(--teal)}
.m.k-barn .head{color:var(--mint)}
.m.k-han .head{color:var(--paper)}
.m.k-mot .head{background:var(--mint);color:var(--teal)}
.m .lbl{position:absolute;left:calc(var(--dx) + 24px);top:calc(var(--dy) - 14px + var(--ly,0px));height:28px;display:flex;align-items:center;gap:8px;padding:0 13px 0 14px;white-space:nowrap;background:var(--paper);color:var(--teal);font-family:var(--head);font-weight:700;font-size:14px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.28);opacity:0;transform:translateX(-8px);transition:opacity 260ms ease,transform 260ms var(--ease);pointer-events:none}
.m:hover .lbl,.m:focus-visible .lbl,.m.on .lbl,.m.named .lbl{opacity:1;transform:none}
.hero.zoom .m.on:not(.named) .lbl{opacity:0}
@media (max-width:700px){.hero.zoom .m.on .lbl{opacity:1}}
.m:hover .head,.m:focus-visible .head{transform:scale(1.1)}
.m.on .head{transform:scale(1.18);box-shadow:0 0 0 3px var(--paper),0 0 0 9px rgba(151,218,184,.45),0 8px 22px rgba(0,0,0,.4)}
.m.on .head::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--mint);animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.1);opacity:0}}
.m.dim{opacity:.32}
.m.under{opacity:0;pointer-events:none}
.m.lblL .lbl{left:auto;right:calc(24px - var(--dx));transform:translateX(8px)}
.m.lblL:hover .lbl,.m.lblL.on .lbl,.m.lblL.named .lbl{transform:none}
.m.hid{opacity:0;pointer-events:none}
.m.off{opacity:.13!important;pointer-events:none!important}
.m.flab .lbl{opacity:1;transform:none}
.m:focus-visible{outline:none}
.m:focus-visible .head{box-shadow:0 0 0 2px var(--paper),0 0 0 5px var(--teal)}
.hero.proj .m{opacity:0;pointer-events:none}
.hero.proj1 .m{opacity:.25;pointer-events:none}
/* klynge */
.c .head{left:calc(var(--dx) - 22px);width:auto;min-width:44px;height:36px;border-radius:999px;padding:0 14px 0 6px;gap:8px;display:flex;align-items:center;background:var(--teal);color:var(--paper);font-family:var(--head);font-weight:700;font-size:14px;white-space:nowrap}
.c .head i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:var(--teal);font-size:13px;font-weight:800}

/* faktakort */
.card{position:absolute;top:calc(50% + 34px);max-height:calc(100% - 100px);overflow:auto;scrollbar-width:thin;width:404px;z-index:8;background:var(--paper);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.38),0 2px 8px rgba(0,0,0,.18);opacity:0;pointer-events:none;transform:translate(var(--cx,24px),-50%);transition:opacity 420ms ease 200ms,transform 620ms var(--ease) 160ms}
.card.r{right:40px;--cx:28px}.card.l{left:40px;--cx:-28px}
.hero.zoom .card.show{opacity:1;pointer-events:auto;transform:translate(0,-50%)}
/* galleri */
.gal{position:relative;aspect-ratio:16/9;background:#d9d4cf;overflow:hidden}
.gal .tr{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;overscroll-behavior-x:contain}
.gal .tr::-webkit-scrollbar{display:none}
.gal figure{position:relative;flex:0 0 100%;height:100%;scroll-snap-align:start}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal .crop{position:absolute;inset:0;background-repeat:no-repeat}
.gal figcaption{position:absolute;left:0;bottom:0;max-width:78%;padding:6px 12px;font-size:11.5px;letter-spacing:.02em;line-height:1.35;color:var(--paper);background:rgba(19,53,54,.84)}
.gal .gb{position:absolute;top:50%;width:38px;height:38px;margin-top:-19px;border-radius:50%;background:rgba(254,251,249,.94);color:var(--teal);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.28);opacity:.88;transition:opacity 200ms,transform 200ms}
.gal .gb:hover{transform:scale(1.08);opacity:1}
.gal .gb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.gal .gp{left:10px}.gal .gn{right:10px}
.gal .gb:focus-visible{opacity:1;outline:2px solid var(--teal);outline-offset:2px}
.gal .gb[disabled]{opacity:0!important;pointer-events:none}
.gal .cnt{position:absolute;right:10px;bottom:9px;padding:3px 9px;border-radius:999px;background:rgba(19,53,54,.78);color:var(--paper);font-size:11.5px;font-weight:700;letter-spacing:.04em}
.gal .dots{position:absolute;left:0;right:0;top:12px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.gal .dots i{width:6px;height:6px;border-radius:50%;background:rgba(254,251,249,.55);box-shadow:0 0 0 1px rgba(0,0,0,.15);transition:all 250ms}
.gal .dots i.on{width:18px;border-radius:3px;background:var(--paper)}
.gal.one .gb,.gal.one .dots,.gal.one .cnt{display:none}
.gal .hint2{display:none;position:absolute;right:56px;bottom:9px;font-size:11px;font-weight:700;color:var(--paper);text-shadow:0 1px 3px rgba(0,0,0,.6);opacity:.95}
.gal.one .hint2{display:none}
.card .bd{padding:20px 26px 22px}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#4d6e6e}
.eyebrow .dot{width:9px;height:9px;border-radius:50%;background:var(--teal)}
.k-arv .eyebrow .dot{background:#C99D84}.k-barn .eyebrow .dot{background:var(--mint)}.k-mot .eyebrow .dot{background:#5DB78E}
.card h2{margin-top:10px;font-family:var(--head);font-weight:800;font-size:27px;line-height:1.12;color:var(--teal);letter-spacing:-.005em}
.facts{display:grid;grid-template-columns:repeat(var(--n,3),1fr);margin-top:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{padding:11px 10px 11px 0}
.facts div+div{padding-left:12px;border-left:1px solid var(--line)}
.facts dt{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#7a8a8a}
.facts dd{margin-top:3px;font-family:var(--head);font-weight:700;font-size:15px;line-height:1.2;color:var(--teal)}
.card p{margin-top:14px;font-size:15px;line-height:1.55;color:#2b2b2b}
.card .todo{margin-top:14px;padding:12px 14px;border:1.5px dashed #c9b3a6;color:#8a6b5a;font-size:13.5px;line-height:1.45;background:#fbf4ef}
.card .ft{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.card .more{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border:1px solid var(--teal);border-radius:999px;color:var(--teal);font-size:14px;font-weight:600;text-decoration:none}
.card .nav{display:flex;align-items:center;gap:6px;font-size:13px;color:#6b7b7b;font-weight:600}
.card .nav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--teal)}
.card .x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;background:rgba(254,251,249,.94);display:grid;place-items:center;color:var(--teal);font-size:18px;line-height:1;z-index:2}
svg.lead{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;opacity:0;transition:opacity 400ms ease}
.hero.zoom svg.lead.show{opacity:1}

/* topplinje */
.bar{position:absolute;left:0;right:0;top:0;z-index:9;display:flex;align-items:flex-start;gap:18px;padding:22px 28px 0;color:var(--paper)}
.bar .t{font-family:var(--head);font-weight:800;font-size:19px;color:var(--peach);white-space:nowrap}
.bar .t span{display:block;font-family:var(--body);font-weight:600;font-size:12.5px;color:rgba(254,251,249,.85);margin-top:2px}
.bar .t .proj{display:flex;align-items:center;gap:7px;margin-top:5px;font-family:var(--body);font-weight:700;font-size:12.5px;color:var(--paper);text-decoration:underline;text-decoration-color:rgba(230,201,184,.7);text-underline-offset:3px}
.bar .t .proj i{width:11px;height:11px;border:2px solid var(--peach);border-radius:3px;transition:background 200ms}
.bar .t .proj.on i{background:var(--peach)}
.chips{display:flex;gap:8px;margin:2px auto 0}
.chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 6px;border-radius:999px;background:rgba(19,53,54,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(254,251,249,.22);font-size:13.5px;font-weight:600;white-space:nowrap;transition:background 200ms}
.chip i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--teal);font-style:normal}
.chip i svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.chip{cursor:pointer}.chip:hover{background:rgba(19,53,54,.85)}
.chip.on{background:var(--paper);color:var(--teal);border-color:var(--paper);box-shadow:0 6px 18px rgba(0,0,0,.25)}.chip.on b{opacity:.85}
.chip.k-arv i{background:var(--peach);color:var(--teal)}.chip.k-barn i{color:var(--mint)}.chip.k-han i{color:var(--paper)}.chip.k-mot i{background:var(--mint);color:var(--teal)}
.chip b{font-weight:700;opacity:.7;font-size:12px}
.tour{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 18px 0 8px;border-radius:999px;background:var(--paper);color:var(--teal);font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.tour i{width:26px;height:26px;border-radius:50%;background:var(--teal);color:var(--paper);display:grid;place-items:center}
.tour.on i{background:#a8673f}
.bar .t .proj{text-align:left}
.tour .ts{display:none}
/* smal skjerm: kategoriknappene på egen linje */
.hero.narrow .bar{flex-wrap:wrap}.hero.narrow .chips{order:3;flex-basis:100%;margin:8px 0 0;justify-content:center}.hero.narrow .tour{margin-left:auto}
/* zoom */
.zctl{position:absolute;left:16px;bottom:14px;z-index:9;display:flex;align-items:center;gap:8px}
.hero.sideL .zctl{left:auto;right:16px}
.zhint{padding:6px 12px;border-radius:999px;background:rgba(19,53,54,.62);backdrop-filter:blur(8px);color:rgba(254,251,249,.92);font-size:12px;font-weight:600;transition:opacity 300ms}
.zhint kbd{font-family:var(--body);font-weight:800;padding:1px 6px;border-radius:4px;background:rgba(254,251,249,.18);margin-right:2px}
.hero.zoom .zhint,.hero.zoomed .zhint{opacity:0}
.zreset{display:none;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:var(--paper);color:var(--teal);font-weight:700;font-size:13.5px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.hero.zoomed .zreset{display:inline-flex}
.ztoast{position:absolute;left:50%;top:50%;z-index:10;transform:translate(-50%,-50%);padding:14px 22px;border-radius:12px;background:rgba(19,53,54,.85);color:var(--paper);font-size:16px;font-weight:700;pointer-events:none;opacity:0;transition:opacity 250ms}
.ztoast.on{opacity:1}
.hint{position:absolute;left:50%;top:calc(var(--barh,72px) + 12px);transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:10px;padding:9px 16px 9px 12px;border-radius:999px;background:rgba(19,53,54,.7);backdrop-filter:blur(8px);color:var(--paper);font-size:13.5px;font-weight:600;white-space:nowrap;transition:opacity 400ms}
.hero.explore .hint,.hero.proj .hint{opacity:0}
.prog{position:absolute;right:28px;top:calc(var(--barh,72px) + 4px);z-index:9;display:none;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;background:rgba(19,53,54,.7);backdrop-filter:blur(8px);color:var(--paper);font-size:13px;font-weight:600}
.hero.touring .prog{display:flex}
.prog .b{width:120px;height:3px;background:rgba(254,251,249,.25);border-radius:2px;overflow:hidden}.prog .b i{display:block;height:100%;background:var(--mint)}
.mini{position:absolute;bottom:60px;z-index:9;width:180px;height:101px;border:1.5px solid rgba(254,251,249,.85);box-shadow:0 6px 18px rgba(0,0,0,.35);background-repeat:no-repeat;opacity:0;transition:opacity 400ms ease;pointer-events:none;overflow:hidden}
.mini.l{left:16px}.mini.r{right:16px}
.hero.zoom .mini,.hero.zoomed .mini{opacity:1}
.mini i{position:absolute;border:1.5px solid var(--paper);box-shadow:0 0 0 999px rgba(10,30,30,.45);transition:all var(--dur) var(--ease)}
.mini b{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 2px var(--teal)}

/* ---------- mobil ---------- */
@media (max-width:700px){
 .top{height:64px;padding:0 18px}.top img{height:24px}.top nav{display:none}.burger{display:block;width:26px;height:16px;border-top:2px solid var(--teal);border-bottom:2px solid var(--teal);position:relative}.burger::after{content:"";position:absolute;left:0;right:0;top:5px;border-top:2px solid var(--teal)}
 .hero{margin:0;aspect-ratio:auto;height:calc(100svh - 64px);min-height:620px}
 .bar{padding:14px 14px 0;gap:10px}
 .bar .t{display:block;font-size:17px}.bar .t span{font-size:11.5px}.bar .t .proj{font-size:11.5px}

 if(e.pointerType!=='mouse'&&!e.target.closest('a.fa,.plbl a,#proj')){clearTimeout(projT);projOn(projLock?ALL:[]);felt.querySelectorAll('a.fa').forEach(a=>a._armed=false)}
 if(e.pointerType==='mouse'&&e.button!==0)return;
 if(!e.target.closest('.stage'))return;
 ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===1){drag={x:e.clientX,y:e.clientY,tx:T.tx,ty:T.ty};dragMoved=false;}
 else if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};}
},true);
addEventListener('pointermove',e=>{
 if(!ptrs.has(e.pointerId))return;
 ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),r=hero.getBoundingClientRect();zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,d/pinch.d);pinch.d=d;dragMoved=true;return;}
 if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!dragMoved&&Math.hypot(dx,dy)<5)return;
  if(!dragMoved){dragMoved=true;cancelIntent();}
  hero.classList.add('dragging');live();T=clamp(drag.tx+dx,drag.ty+dy,T.s);V={...T};place();}
});
function endPtr(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
 if(ptrs.size===0){drag=null;hero.classList.remove('dragging');}
 else{const q=[...ptrs.values()][0];drag={x:q.x,y:q.y,tx:T.tx,ty:T.ty};}}
addEventListener('pointerup',endPtr);addEventListener('pointercancel',endPtr);
hero.addEventListener('click',e=>{if(dragMoved){e.preventDefault();e.stopPropagation();dragMoved=false;}},true);
$('zreset').onclick=resetView;
hero.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')projHide();if(e.pointerType==='mouse'&&!tour&&!drag)setTimeout(()=>{if(!hero.matches(':hover')&&!drag)closeAll()},450)});
// mens alle fire prosjektene vises: de blir stående så lenge pekeren er i bevegelse, og skjules først når den har stått i ro utenfor et prosjekt
hero.addEventListener('pointermove',e=>{if(projCur.length>1&&!projLock&&!e.target.closest('a.fa,.plbl a,#proj'))projHide()},{passive:true});
addEventListener('keydown',e=>{
 if(e.target.closest&&e.target.closest('input,textarea'))return;
 if(e.key==='Escape'){if(tour)stopTour();if(S.mode!=='start')closeAll();else if(V.s>1.01)resetView();projClear();return}
 if(S.mode!=='start'&&e.key==='ArrowRight')step(1);if(S.mode!=='start'&&e.key==='ArrowLeft')step(-1);
 if(!e.ctrlKey&&!e.metaKey&&(e.key==='+'||e.key==='-'||e.key==='0')&&hero.matches(':hover')){e.preventDefault();if(e.key==='0')resetView();else zoomAt(G.W/2,G.H/2,e.key==='+'?1.25:0.8);}
});
addEventListener('resize',()=>{layout();V={...HOME};if(S.id)open(S.id,{now:1,refocus:1});else{T={...HOME};place();}});
build();setTourUI(false);layout();place();
document.fonts&&document.fonts.ready.then(()=>{layout();place()});
if(mob())document.querySelector('#hint span').textContent='Trykk på et punkt for å se mer';
window.demo={open,closeAll,place,layout,P,byId,projOn,S:()=>S,T:()=>T,V:()=>V,F,zoomAt,resetView,step,gal:k=>card.goto&&card.goto(k),setNoAnim:v=>document.documentElement.classList.toggle('noanim',v)};
</script>
</body>
